name: Build PKSMG9 CIA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Get this repository (the PKSMG9 changes)
        uses: actions/checkout@v4

      - name: Install tools and 3DS libraries
        run: |
          apt-get update
          apt-get install -y git rsync python3 python3-pip cmake build-essential pkg-config zip unzip libssl-dev libcurl4-openssl-dev
          pip3 install GitPython --break-system-packages || pip3 install GitPython
                   curl -sI https://pkg.devkitpro.org/packages/dkp-libs.db | head -5 || true
          MISSING=""
          for pkg in libctru citro3d citro2d 3ds-curl 3ds-bzip2 3ds-mpg123 3ds-pkg-config 3dstools tex3ds; do
            if dkp-pacman -Qq "$pkg" >/dev/null 2>&1; then echo "$pkg already installed"; else MISSING="$MISSING $pkg"; fi
          done
          echo "Missing packages: $MISSING"
          if [ -n "$MISSING" ]; then
            ok=0
            for i in 1 2 3 4 5; do
              if dkp-pacman -Sy --noconfirm --needed $MISSING; then ok=1; break; fi
              echo "Attempt $i failed, waiting 60 seconds"
              sleep 60
            done
            [ "$ok" = "1" ] || exit 1
          fi

      - name: Build makerom, bannertool and 3dstool from source
        run: |
          set -e
          mkdir -p /tmp/tools /usr/local/bin
          cd /tmp/tools
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git
          make -C Project_CTR/makerom deps -j4
          make -C Project_CTR/makerom -j4
          cp "$(find Project_CTR/makerom -type f -name makerom | head -1)" /usr/local/bin/makerom
          git clone --recursive --depth 1 https://github.com/RedTopper/bannertool.git
          apt-get install -y libpng-dev zlib1g-dev || true
          cmake -S bannertool -B bannertool/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bannertool/build -j4
          cp "$(find bannertool -type f -name bannertool -perm -u+x | head -1)" /usr/local/bin/bannertool
          git clone --recursive --depth 1 https://github.com/dnasdw/3dstool.git
          cmake -S 3dstool -B 3dstool/build -DCMAKE_BUILD_TYPE=Release
          cmake --build 3dstool/build -j4
          cp "$(find 3dstool -type f -name 3dstool -perm -u+x | head -1)" /usr/local/bin/3dstool
          makerom -version || true
          bannertool || true
          3dstool --help | head -3 || true

      - name: Download PKSM 10.4.2 with all submodules
        run: |
          git clone --recursive --branch 10.4.2 https://github.com/FlagBrew/PKSM.git /tmp/PKSM

      - name: Apply the PKSMG9 changes
        run: |
          cp -a "$GITHUB_WORKSPACE/PKSMG9-changes/core/." /tmp/PKSM/core/
          rsync -a --exclude core --exclude README_BUILD.txt "$GITHUB_WORKSPACE/PKSMG9-changes/" /tmp/PKSM/

      - name: Build
        run: |
          cd /tmp/PKSM
          git config --global --add safe.directory '*'
          make 3ds-release 2>&1 | tail -n 60
          mkdir -p "$GITHUB_WORKSPACE/out"
          find /tmp/PKSM -type f \( -name "*.cia" -o -name "*.3dsx" \) -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload the result
        uses: actions/upload-artifact@v4
        with:
          name: PKSMG9
          path: out/*
